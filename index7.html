<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Flexbox Responsive Layout - codegymtask26</title>
    <style>
        /* Đặt lại CSS mặc định */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        /* Container bao bọc toàn bộ trang, sử dụng flex dọc */
        .wrapper {
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Đảm bảo chiều cao tối thiểu bằng màn hình */
        }

        /* Định dạng Header và Footer */
        .header, .footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        /* Định dạng Thanh điều hướng */
        .nav {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 18px;
        }

        /* Vùng chứa Main Content và Sidebar */
        .main-wrapper {
            display: flex;
            flex-direction: row; /* Dàn ngang trên Desktop */
            flex: 1; /* Chiếm toàn bộ không gian còn lại giữa Nav và Footer */
        }

        .content {
            flex: 3; /* Chiếm 3/4 chiều rộng */
            background-color: #ecf0f1;
            padding: 30px;
            font-size: 20px;
        }

        .sidebar {
            flex: 1; /* Chiếm 1/4 chiều rộng */
            background-color: #bdc3c7;
            padding: 30px;
            font-size: 18px;
        }

        /* 
         * RESPONSIVE: Khi màn hình nhỏ hơn hoặc bằng 768px (Mobile/Tablet nhỏ)
         * Chuyển đổi hướng Flex từ ngang (row) sang dọc (column) 
         */
        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
            }
            
            .content, .sidebar {
                flex: auto; /* Trả lại kích thước tự nhiên để xếp chồng */
                min-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header class="header">Header</header>
        
        <nav class="nav">Navigation Menu</nav>
        
        <div class="main-wrapper">
            <main class="content">
                <h2>Main Content</h2>
                <p>Đây là khu vực hiển thị nội dung chính của trang web. Trên màn hình máy tính, nó sẽ nằm bên trái và chiếm nhiều diện tích hơn so với Sidebar.</p>
            </main>
            
            <aside class="sidebar">
                <h2>Sidebar</h2>
                <p>Chứa tin tức phụ, quảng cáo hoặc các liên kết bổ sung.</p>
            </aside>
        </div>
        
        <footer class="footer">Footer</footer>
    </div>

</body>
</html>
