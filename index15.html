<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 3 Cột Bootstrap - codegymtask34</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* Tinh chỉnh chiều cao ảnh Carousel cho đồng đều */
        .carousel-item img {
            height: 400px;
            object-fit: cover;
        }
        /* Chiều cao cho các cột Grid để thấy rõ việc căn giữa bằng Flexbox */
        .col-box {
            height: 150px;
            border-radius: 8px;
            font-size: 1.25rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Bước 3: Display Property (Ẩn trên mobile, hiện trên màn hình >= 768px) -->
    <div class="d-none d-md-block bg-warning text-center p-3 fw-bold">
        <p class="m-0"><i class="fas fa-desktop me-2"></i>Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px (md trở lên)</p>
    </div>

    <div class="container mt-4">
        <!-- Bước 5: Sử dụng Font Awesome cho Tiêu đề -->
        <h3 class="text-primary mb-4"><i class="fas fa-home me-2"></i>Trang chủ</h3>

        <!-- Bước 2: Áp dụng Margin & Padding -->
        <div class="bg-white my-5 py-3 shadow-sm rounded border">
            <h4 class="text-center m-0 text-secondary">Khoảng cách này được điều chỉnh bằng <code>my-5</code> và <code>py-3</code></h4>
        </div>

        <!-- Bước 1: Cấu trúc Grid 3 cột + Flexbox -->
        <h4 class="mb-3"><i class="fas fa-columns me-2"></i>Bố cục 3 cột</h4>
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="d-flex justify-content-center align-items-center bg-white p-3 col-box border shadow-sm">
                    <p class="m-0 text-dark">Phần 1</p>
                </div>
            </div>
            <div class="col-md-4">
                <!-- Cột giữa nổi bật hơn -->
                <div class="d-flex justify-content-center align-items-center bg-secondary p-3 text-white col-box shadow">
                    <p class="m-0">Phần 2</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="d-flex justify-content-center align-items-center bg-white p-3 col-box border shadow-sm">
                    <p class="m-0 text-dark">Phần 3</p>
                </div>
            </div>
        </div>

        <!-- Bước 4: Tạo Carousel -->
        <h4 class="mb-3"><i class="fas fa-images me-2"></i>Slideshow (Carousel)</h4>
        <div id="myCarousel" class="carousel slide mb-5 shadow rounded overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=1200&h=400&fit=crop" class="d-block w-100" alt="Hình ảnh 1">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1200&h=400&fit=crop" class="d-block w-100" alt="Hình ảnh 2">
                </div>
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1200&h=400&fit=crop" class="d-block w-100" alt="Hình ảnh 3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
        </div>

        <!-- Bước 6: Tạo Form liên hệ -->
        <h4 class="mb-3"><i class="fas fa-envelope-open-text me-2"></i>Liên hệ</h4>
        <form class="bg-white p-4 border rounded shadow-sm mb-5 mx-auto" style="max-width: 800px;">
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Họ và tên</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập họ và tên">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email">
            </div>
            <div class="mb-4">
                <label for="message" class="form-label fw-bold">Nội dung</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Nhập nội dung thông điệp của bạn..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">
                <i class="fas fa-paper-plane me-2"></i> Gửi Thông Tin
            </button>
        </form>

    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
