<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - codegymtask31</title>
    <!-- Nhúng Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <!-- Form sẽ chiếm 6 cột trên Desktop (lg) và 8 cột trên Tablet (md) -->
            <div class="col-md-8 col-lg-6">
                
                <!-- Bắt đầu Card -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề và mô tả -->
                        <h2 class="text-center fw-bold text-primary mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4">Vui lòng điền đầy đủ thông tin để tạo tài khoản mới.</p>

                        <!-- Bắt đầu Form -->
                        <form action="#">
                            
                            <!-- Họ và tên (Input) -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên của bạn" required>
                            </div>

                            <!-- Email (Input) -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không bao giờ chia sẻ email của bạn với bất kỳ ai.</div>
                            </div>

                            <!-- Mật khẩu và Xác nhận (Chia 2 cột) -->
                            <div class="row mb-3">
                                <div class="col-sm-6 mb-3 mb-sm-0">
                                    <label for="password" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" placeholder="Tạo mật khẩu" required>
                                </div>
                                <div class="col-sm-6">
                                    <label for="confirmPassword" class="form-label fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                                </div>
                            </div>

                            <!-- Giới tính (Radio Button) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="genderOptions" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- Sở thích (Checkbox) -->
                            <div class="mb-3">
                                <label
