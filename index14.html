<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây Dựng Trang Chủ - codegymtask33</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nhúng Font Awesome để dùng Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* CSS tuỳ chỉnh một chút để ảnh trong Carousel có chiều cao đồng đều và đẹp hơn */
        .carousel-item img {
            height: 450px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. Navbar với Font Awesome -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="#"><i class="fas fa-home"></i> MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Hero Section với Carousel -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?w=1600&h=450&fit=crop" class="d-block w-100" alt="Slide thiên nhiên 1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1511576661531-b34d7da5d0f4?w=1600&h=450&fit=crop" class="d-block w-100" alt="Slide thiên nhiên 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- 3. Section ứng dụng Flexbox -->
    <div class="d-flex justify-content-center align-items-center bg-light py-5 border-bottom">
        <h2 class="text-primary m-0"><i class="fas fa-bullhorn me-2"></i>Chào mừng đến với trang web của chúng tôi!</h2>
    </div>

    <!-- 4. Contact Form -->
    <div class="container py-5">
        <h3 class="text-center mb-4"><i class="fas fa-envelope-open-text text-secondary me-2"></i>Liên Hệ</h3>
        <!-- Bọc form lại và giới hạn chiều rộng để nhìn cân đối trên desktop -->
        <form class="mx-auto border p-4 rounded-3 shadow-sm bg-white" style="max-width: 600px;">
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Tên của bạn</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="name" placeholder="Nhập tên">
                </div>
            </div>
            <div class="mb-4">
                <label for="email" class="form-label fw-bold">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-at"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="fas fa-paper-plane me-2"></i>Gửi Thông Tin</button>
        </form>
    </div>

    <!-- Nhúng Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
