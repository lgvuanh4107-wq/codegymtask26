<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery - codegymtask26</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <h1>Bộ Sưu Tập Ảnh Responsive</h1>
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1015/400/300" alt="Ảnh 1">
                <div class="desc">Ảnh 1 - Phong cảnh</div>
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1016/400/300" alt="Ảnh 2">
                <div class="desc">Ảnh 2 - Thiên nhiên</div>
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1019/400/300" alt="Ảnh 3">
                <div class="desc">Ảnh 3 - Núi non</div>
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos/id/1025/400/300" alt="Ảnh 4">
                <div class="desc">Ảnh 4 - Động vật</div>
            </div>
        </div>
    </div>
</body>
</html>
